<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест отображения результатов - OptionPricer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Тест отображения результатов</h1>
            <p class="subtitle">Тестирование функции отображения результатов</p>
        </header>

        <main>
            <section class="input-section">
                <h2>Управление тестами</h2>
                <button onclick="testBlackScholesResults()" class="btn btn-primary">
                    Тест результатов Блэка-Шоулза
                </button>
                <button onclick="testBinomialResults()" class="btn btn-primary" style="margin-top: 10px;">
                    Тест результатов биномиального дерева
                </button>
                <button onclick="testWithoutGreeks()" class="btn btn-secondary" style="margin-top: 10px;">
                    Тест результатов без греков
                </button>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>Результаты расчета</h2>
                <div id="resultsContent">
                    <!-- Результаты будут вставлены динамически через JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // Форматирование числа до четырех десятичных знаков
        function formatNumber(value) {
            if (typeof value !== 'number' || isNaN(value)) {
                return 'N/A';
            }
            return value.toFixed(4);
        }

        // Отображение результатов расчета
        function displayResults(result) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            const html = `
                <div class="results-header">
                    <div class="model-info">
                        Модель: ${result.model || 'Unknown'}
                    </div>
                    <div class="computation-time">
                        Время расчета: ${result.computation_time_ms || 0} мс
                    </div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <h3>Цена опциона</h3>
                        <div class="price-highlight">
                            <span class="price-label">Стоимость опциона</span>
                            ${formatNumber(result.option_price)}
                        </div>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th>Параметр</th>
                                    <th>Значение</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Цена опциона</td>
                                    <td class="result-value">${formatNumber(result.option_price)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    ${result.greeks ? `
                    <div class="result-card">
                        <h3>Греки (Greeks)</h3>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th>Грек</th>
                                    <th>Значение</th>
                                    <th>Описание</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Delta (Δ)</td>
                                    <td class="result-value">${formatNumber(result.greeks.delta)}</td>
                                    <td>Чувствительность к цене</td>
                                </tr>
                                <tr>
                                    <td>Gamma (Γ)</td>
                                    <td class="result-value">${formatNumber(result.greeks.gamma)}</td>
                                    <td>Скорость изменения Delta</td>
                                </tr>
                                <tr>
                                    <td>Theta (Θ)</td>
                                    <td class="result-value">${formatNumber(result.greeks.theta)}</td>
                                    <td>Временной распад</td>
                                </tr>
                                <tr>
                                    <td>Vega (ν)</td>
                                    <td class="result-value">${formatNumber(result.greeks.vega)}</td>
                                    <td>Чувствительность к волатильности</td>
                                </tr>
                                <tr>
                                    <td>Rho (ρ)</td>
                                    <td class="result-value">${formatNumber(result.greeks.rho)}</td>
                                    <td>Чувствительность к ставке</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    ` : ''}
                </div>
            `;
            
            resultsContent.innerHTML = html;
            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Тест результатов Блэка-Шоулза
        function testBlackScholesResults() {
            const result = {
                success: true,
                model: 'Black-Scholes',
                option_price: 8.9162,
                greeks: {
                    delta: 0.5596,
                    gamma: 0.0184,
                    theta: -6.4135,
                    vega: 36.7311,
                    rho: 51.8644
                },
                computation_time_ms: 12
            };
            displayResults(result);
        }

        // Тест результатов биномиального дерева
        function testBinomialResults() {
            const result = {
                success: true,
                model: 'Биномиальное дерево (100 шагов)',
                option_price: 8.9245,
                greeks: {
                    delta: 0.5601,
                    gamma: 0.0185,
                    theta: -6.4289,
                    vega: 36.7892,
                    rho: 51.9123
                },
                computation_time_ms: 145
            };
            displayResults(result);
        }

        // Тест результатов без греков
        function testWithoutGreeks() {
            const result = {
                success: true,
                model: 'Black-Scholes',
                option_price: 12.3456,
                computation_time_ms: 8
            };
            displayResults(result);
        }
    </script>
</body>
</html>
